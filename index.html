<!doctype html>
<!-- data-glass：macOS 26 原版 Liquid Glass 更通透，对应 design.md §3.2 的 clear 档 -->
<html lang="zh-CN" data-glass="clear">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="2026/27 雪季 Epic Local 与 Ikon Base 的美国雪场分布，以及朋友们的出发地。" />
    <title>雪季 Pass 地图</title>
    <script>
      // 在样式生效前套用用户在设置里选的外观，避免先闪一下系统外观（key 与 src/lib/theme.ts 一致）
      try {
        var theme = localStorage.getItem('skiplan26:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007AFF'/%3E%3Cpath d='M5 24 13 10l4.5 7.5 3-4.5L27 24z' fill='white'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
